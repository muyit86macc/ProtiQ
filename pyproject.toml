[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protiq"
version = "0.2.0"
description = "Automated protein function prediction from sequence and structure similarity (kNN + LIME)"
readme = "README.md"
authors = [{ name = "Muyi Tang" }, { name = "Xenia Huang" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "biopython>=1.80",
    "requests>=2.28",
    "joblib>=1.2",
    "lime>=0.2.0.1",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
protiq = "protiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
